[project]
name = "willow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.4",
    "apscheduler>=3.11.3",
    "piccolo[all]>=1.36.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "starlette>=1.3.1",
    "uvicorn>=0.52.0",
    "uvloop>=0.22.1",
]

[project.scripts]
willow = "willow.__main__:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
]
